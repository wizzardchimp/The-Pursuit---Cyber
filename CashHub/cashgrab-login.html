<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>CashGrab Hub - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(0, 200, 83, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 214, 0, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 200, 83, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo-area {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c853, #ffd600);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 200, 83, 0.3);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .login-form {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 28px;
            border: 1px solid #e0e0e0;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            background: #f9f9f9;
            color: #1a1a1a;
            transition: all 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            min-height: 52px;
        }

        .form-input::placeholder {
            color: #999;
            font-weight: 400;
        }

        .form-input:focus {
            border-color: #00c853;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.1);
            transform: translateY(-2px);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .form-input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            transition: color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-password:hover {
            color: #00a844;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #00c853, #00a844);
            color: #ffffff;
            border: none;
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 200, 83, 0.3);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 54px;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.02em;
        }

        .login-btn:active:not(:disabled) {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #00e676, #00c853);
            box-shadow: 0 12px 30px rgba(0, 200, 83, 0.4);
        }

        .return-btn {
            width: 100%;
            background: transparent;
            color: #666;
            border: 1px solid #e0e0e0;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            min-height: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        .return-btn:active {
            background: #f5f5f5;
            border-color: #ccc;
        }

        .return-btn:hover {
            border-color: #bbb;
            background: #fafafa;
        }

        .error-message {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #d32f2f;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .copyright {
            font-size: 11px;
            margin-top: 28px;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.02em;
            color: #999;
        }

        .warning-text {
            font-size: 10px;
            margin-top: 8px;
            font-weight: 400;
            text-align: center;
            color: #d32f2f;
            letter-spacing: 0.05em;
        }

        @media screen and (max-width: 360px) {
            .login-form {
                padding: 28px 22px;
            }

            .login-title {
                font-size: 22px;
            }

            .form-input {
                font-size: 16px;
            }
        }

        @media screen and (min-height: 800px) {
            .login-container {
                padding-top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <span class="logo-text"><i class="fas fa-hand-holding-usd"></i></span>
        </div>

        <div class="login-form">
            <h2 class="login-title">CashGrab Hub</h2>
            <p class="login-subtitle">Financial Operations Portal</p>

            <div class="error-message" id="errorMessage">
                Invalid credentials. Access denied.
            </div>

            <div class="form-group">
                <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Password (Case Sensitive)"
                        autocomplete="current-password"
                        required
                    >
                    <button class="toggle-password" type="button" onclick="togglePassword()" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" viewBox="0 0 576 512">
                            <path d="M288 32c-80.8 0-145.5 36.8-192.6 80.6C48.6 156 17.3 208 2.5 243.7c-3.3 7.9-3.3 16.7 0 24.6C17.3 304 48.6 356 95.4 399.4C142.5 443.2 207.2 480 288 480s145.5-36.8 192.6-80.6c46.8-43.5 78.1-95.4 93-131.1c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C433.5 68.8 368.8 32 288 32zM144 256a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm144-64c0 35.3-28.7 64-64 64c-7.1 0-13.9-1.2-20.3-3.3c-5.5-1.8-11.9 1.6-11.7 7.4c.3 6.9 1.3 13.8 3.2 20.7c13.7 51.2 66.4 81.6 117.6 67.9s81.6-66.4 67.9-117.6c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3z"/>
                        </svg>
                        <svg id="eyeSlashIcon" viewBox="0 0 640 512" style="display:none">
                            <path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zM223.1 149.5C248.6 126.2 282.7 112 320 112c79.5 0 144 64.5 144 144c0 24.9-6.3 48.3-17.4 68.7L408 294.5c8.4-19.3 10.6-41.4 4.8-63.3c-11.1-41.5-47.8-69.4-88.6-71.1c-5.8-.2-9.2 6.1-7.4 11.7c2.1 6.4 3.3 13.2 3.3 20.3c0 10.2-2.4 19.8-6.6 28.3l-90.3-70.8zM373 389.9c-16.4 6.5-34.3 10.1-53 10.1c-79.5 0-144-64.5-144-144c0-6.9 .5-13.6 1.4-20.2L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5L373 389.9z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button class="login-btn" id="loginBtn" onclick="login()">
                <span id="loginText">Access Portal</span>
            </button>

            <button class="return-btn" onclick="window.location.href='forgotlogin.html'">
                Forgot Password?
            </button>
        </div>

        <p class="copyright">&copy; 2026 CashGrab Hub Financial Systems</p>
        <p class="warning-text">Unauthorized access is monitored</p>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            const eyeSlashIcon = document.getElementById("eyeSlashIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.style.display = "none";
                eyeSlashIcon.style.display = "block";
            } else {
                passwordInput.type = "password";
                eyeIcon.style.display = "block";
                eyeSlashIcon.style.display = "none";
            }
        }

        function login() {
            const loginBtn = document.getElementById("loginBtn");
            const loginText = document.getElementById("loginText");
            const errorMessage = document.getElementById("errorMessage");
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");

            const inputUser = usernameInput.value.trim().toLowerCase();
            const inputPass = passwordInput.value;
            const validUser = "thelonesaber";
            const validPass = "MadMax1";

            errorMessage.style.display = "none";

            loginBtn.disabled = true;
            loginText.innerHTML = '<div class="loading"></div>';

            setTimeout(() => {
                if (inputUser === validUser && inputPass === validPass) {
                    loginText.innerHTML = '&#10003; Access Granted';
                    loginBtn.style.background = 'linear-gradient(135deg, #ffd600, #ffab00)';
                    loginBtn.style.color = '#1a1a1a';

                    setTimeout(() => {
                        window.location.href = "cashgrab.html";
                    }, 800);
                } else {
                    loginBtn.disabled = false;
                    loginText.textContent = "Access Portal";
                    loginBtn.style.background = '';
                    loginBtn.style.color = '';
                    errorMessage.style.display = "block";

                    usernameInput.value = "";
                    passwordInput.value = "";
                    usernameInput.focus();

                    errorMessage.style.animation = "none";
                    setTimeout(() => {
                        errorMessage.style.animation = "shake 0.5s ease-in-out";
                    }, 10);
                }
            }, 1000);
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !document.getElementById("loginBtn").disabled) {
                login();
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => {
                document.getElementById("username").focus();
            }, 1000);
        });
    </script>
</body>
</html>
