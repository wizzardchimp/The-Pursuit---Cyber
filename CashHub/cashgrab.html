<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CashGrab Hub</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(0, 200, 83, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 200, 83, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px 16px;
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c853, #ffd600);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #0a0a0f;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00c853, #ffd600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-top: -16px;
            margin-bottom: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 0 16px 24px;
            flex: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px 20px;
            text-decoration: none;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            cursor: pointer;
        }

        .card:not(.disabled):hover {
            transform: translateY(-3px);
            border-color: rgba(0, 200, 83, 0.4);
            box-shadow: 0 8px 30px rgba(0, 200, 83, 0.12);
        }

        .card:not(.disabled):active {
            transform: translateY(0);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .card-icon.green {
            background: rgba(0, 200, 83, 0.15);
            color: #00c853;
        }

        .card-icon.gold {
            background: rgba(255, 214, 0, 0.15);
            color: #ffd600;
        }

        .card-icon.grey {
            background: rgba(255, 255, 255, 0.06);
            color: #555;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .card.disabled {
            opacity: 0.5;
            pointer-events: none;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 20px 16px 32px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 10px 22px;
            border-radius: 24px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .copyright {
            margin-top: 16px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 0.5px;
        }

        @media (min-width: 480px) {
            .cards-grid {
                grid-template-columns: 1fr 1fr;
                max-width: 560px;
                margin: 0 auto;
                width: 100%;
            }

            .card.disabled {
                grid-column: 1 / -1;
                max-width: 280px;
                margin: 0 auto;
                width: 100%;
            }
        }

        @media (min-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr 1fr 1fr;
                max-width: 820px;
            }

            .card.disabled {
                grid-column: auto;
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">CG</div>
        <h1>CashGrab Hub</h1>
    </header>
    <p class="subtitle">Operator Toolkit</p>

    <div class="cards-grid">
        <a href="cashgrab-tickets.html" class="card">
            <div class="card-icon green">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <div class="card-title">Ticket Tout Hub</div>
            <div class="card-desc">Resell event tickets at inflated prices</div>
        </a>

        <a href="cashgrab-crypto.html" class="card">
            <div class="card-icon gold">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="card-title">Crypto Cash Hub</div>
            <div class="card-desc">Pump and dump crypto schemes</div>
        </a>

        <div class="card disabled">
            <div class="card-icon grey">
                <i class="fas fa-qrcode"></i>
            </div>
            <div class="card-title">QR Code Generator</div>
            <div class="card-desc">Generate malicious QR codes</div>
            <span class="badge">Coming Soon</span>
        </div>
    </div>

    <footer class="footer">
        <a href="../Index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
        <div class="copyright">&copy; 2026 CashGrab Hub. For educational use only.</div>
    </footer>

</body>
</html>
